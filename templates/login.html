<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Stock Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body class="login-page">
  <div class="login-shell">
    <article class="login-card glass-card">
      <div class="login-brand">
        <div class="login-logo">SO</div>
        <div>
          <h1>Welcome Back</h1>
          <p id="loginSubtitle">Login to continue to your account</p>
        </div>
      </div>

      <div id="messageBox" class="flash-grid"></div>

      <form id="emailForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="Enter password" required />
            <button type="button" class="icon-button" id="togglePassword" aria-label="Show password"><span class="password-icon">👁</span></button>
          </div>
        </div>

        <div class="form-meta">
          <a href="{{ url_for('main.forgot_page') }}" class="text-link" id="forgotPassword">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="emailButton">Login with Email</button>
      </form>

      <div class="divider-row"><span>OR</span></div>

      <button type="button" class="btn btn-outline btn-full" id="googleLogin"><span class="google-mark">G</span> Continue with Google</button>

      <p class="signup-copy">Don't have an account? <a href="{{ url_for('main.register_page') }}" class="text-link">Create Account</a></p>
    </article>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/authen.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
