<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Account | Stock Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
  <div class="login-shell">
    <article class="login-card glass-card">
      <div class="login-brand">
        <div class="login-logo">SO</div>
        <div>
          <h1>Create Account</h1>
          <p>Create your Stock Optimizer account</p>
        </div>
      </div>

      <div id="messageBox" class="flash-grid"></div>

      <form id="registerForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="Create password" required />
            <button type="button" class="icon-button" id="togglePassword"><span class="password-icon">👁</span></button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="createAccount">Create Account</button>
      </form>

      <div class="divider-row"><span>OR</span></div>

      <button id="googleRegister" class="btn btn-outline btn-full"><span class="google-mark">G</span> Continue with Google</button>

      <p class="signup-copy">Already have an account? <a href="{{ url_for('main.login_page') }}" class="text-link">Login</a></p>
    </article>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
