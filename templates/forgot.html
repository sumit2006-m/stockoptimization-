<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password | Stock Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
  <div class="login-shell">
    <article class="login-card glass-card">
      <div class="login-brand">
        <div class="login-logo">SO</div>
        <div>
          <h1>Reset Password</h1>
          <p>Enter your email to receive password reset instructions.</p>
        </div>
      </div>

      <div id="messageBox" class="flash-grid"></div>

      <form id="forgotForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <button type="submit" class="btn btn-primary btn-full">Send reset email</button>
      </form>

      <p class="signup-copy">Remembered your password? <a href="{{ url_for('main.login_page') }}" class="text-link">Login</a></p>
    </article>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/forgot.js') }}"></script>
</body>
</html>
